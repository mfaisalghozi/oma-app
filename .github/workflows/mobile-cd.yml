name: Mobile CD

# Builds release artifacts for Android (AAB + APK) and iOS (unsigned
# Runner.app) on a version tag or a manual run, and uploads them as workflow
# artifacts. Signing and store upload are not wired yet: see the
# "CI/CD" section of the README for the TODO list and required secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 0.1.0). Empty = pubspec version."
        required: false
        default: ""

concurrency:
  group: mobile-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in sync with mobile-ci.yml.
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
      label: ${{ steps.v.outputs.label }}
    defaults:
      run:
        working-directory: .
    steps:
      - id: v
        env:
          INPUT_NAME: ${{ inputs.build_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          name="$INPUT_NAME"
          if [ -z "$name" ] && [ "$REF_TYPE" = "tag" ]; then
            name="${REF_NAME#v}"
          fi
          if [ -n "$name" ] && ! printf '%s' "$name" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "::error::build_name may only contain letters, digits, dot, underscore and dash."
            exit 1
          fi
          # Keep artifact names safe even if the manual input has spaces/slashes.
          label="$(printf '%s' "${name:-pubspec}" | tr -c 'A-Za-z0-9._-' '-')-$RUN_NUMBER"
          {
            echo "name=$name"
            echo "number=$RUN_NUMBER"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter github

  android:
    name: Android (AAB + APK)
    needs: [version, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Write dart-define file
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: |
          if [ -z "$DART_DEFINES_JSON" ]; then
            echo "::error::DART_DEFINES_JSON is required for release builds."
            exit 1
          fi
          mkdir -p config
          printf '%s' "$DART_DEFINES_JSON" > config/ci.json

      # TODO(signing): decode ANDROID_KEYSTORE_BASE64 into android/upload.jks,
      # write android/key.properties from ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and add a release
      # signingConfig in android/app/build.gradle.kts. Until then release
      # builds are signed with the debug key (fine for sideload testing only).
      # TODO(firebase): decode GOOGLE_SERVICES_JSON_BASE64 into
      # android/app/google-services.json once the Firebase project exists.

      - name: Build app bundle
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: |
          args=(--build-number="$BUILD_NUMBER")
          if [ -n "$BUILD_NAME" ]; then args+=(--build-name="$BUILD_NAME"); fi
          flutter build appbundle --release "${args[@]}" --dart-define-from-file=config/ci.json

      - name: Build APK
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: |
          args=(--build-number="$BUILD_NUMBER")
          if [ -n "$BUILD_NAME" ]; then args+=(--build-name="$BUILD_NAME"); fi
          flutter build apk --release "${args[@]}" --dart-define-from-file=config/ci.json

      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ needs.version.outputs.label }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # TODO(store): upload the AAB to Play Console (internal track) with
      # PLAY_SERVICE_ACCOUNT_JSON, e.g. r0adkll/upload-google-play or fastlane
      # supply. Needs the Play developer account and a first manual upload.

  ios:
    name: iOS (no codesign)
    needs: [version, check]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Write dart-define file
        env:
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: |
          if [ -z "$DART_DEFINES_JSON" ]; then
            echo "::error::DART_DEFINES_JSON is required for release builds."
            exit 1
          fi
          mkdir -p config
          printf '%s' "$DART_DEFINES_JSON" > config/ci.json

      # TODO(firebase): decode GOOGLE_SERVICE_INFO_PLIST_BASE64 into
      # ios/Runner/GoogleService-Info.plist once the Firebase project exists.

      - name: Build iOS (unsigned)
        env:
          BUILD_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: |
          args=(--build-number="$BUILD_NUMBER")
          if [ -n "$BUILD_NAME" ]; then args+=(--build-name="$BUILD_NAME"); fi
          flutter build ios --release --no-codesign "${args[@]}" --dart-define-from-file=config/ci.json

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner-unsigned.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ios-${{ needs.version.outputs.label }}
          path: apps/mobile/build/ios/iphoneos/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 30

      # TODO(signing + store): import IOS_DIST_CERT_P12_BASE64 /
      # IOS_DIST_CERT_PASSWORD into a temp keychain, install
      # IOS_PROVISIONING_PROFILE_BASE64, then
      # `flutter build ipa --export-options-plist=ios/ExportOptions.plist`
      # and upload to TestFlight with the App Store Connect API key
      # (APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
      # APP_STORE_CONNECT_KEY_P8). Needs the Apple Developer account.
