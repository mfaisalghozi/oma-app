  /v1/me/onboarding:
    post:
      tags:
        - Onboarding
      operationId: submitOnboarding
      summary: Atomically persist the complete onboarding form
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - user_id
                      - onboarding_completed
                      - onboarding_completed_at
                    properties:
                      user_id: &a17
                        type: string
                        format: uuid
                      onboarding_completed:
                        type: boolean
                        enum:
                          - true
                      onboarding_completed_at:
                        type: string
                        format: date-time
                    additionalProperties: false
        "400":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: CONSENT_REQUIRED or restricted/uninitialized account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: ONBOARDING_ALREADY_COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: ONBOARDING_VALIDATION_FAILED with all invalid fields, or
            PHOTO_UPLOAD_INCOMPLETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: STORAGE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/devices:
    post:
      tags:
        - Devices
      operationId: registerDevice
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - platform
                - provider
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 8192
                platform:
                  type: string
                  enum:
                    - ios
                    - android
                provider:
                  type: string
                  enum:
                    - fcm
                    - apns
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - device_id
                      - registered
                    properties:
                      device_id: &a2
                        type: string
                        format: uuid
                      registered:
                        type: boolean
                    additionalProperties: false
        "400": &a3
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401": &a4
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403": &a5
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
