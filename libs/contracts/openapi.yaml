      parameters:
        - name: id
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PhotoUpload"
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
