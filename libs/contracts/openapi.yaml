openapi: 3.0.3
info:
  title: OMA API
  version: 0.1.0
  description: Shared API contract for the Go backend and its clients.
tags:
  - name: Health
    description: API health checks.
  - name: Accounts
    description: Authenticated account initialization and account state.
  - name: Consents
    description: Legal documents, consent decisions, and consent revocations.
  - name: Profile Data
    description: Master data used to build and update user profiles.
  - name: Photos
    description: Profile photo upload reservations and photo management.
  - name: Onboarding
    description: Submission of the complete onboarding form.
  - name: Devices
    description: Push notification device registration and removal.
  - name: Profiles
    description: Read and update the authenticated user's profile.
  - name: Locations
    description: Manage the authenticated user's location coordinates.
  - name: Discovery
    description: Ranked eligible candidate decks and current public profiles.
servers:
  - url: /
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /v1/me/initialize:
    post:
      tags:
        - Accounts
      operationId: initializeAccount
      summary: Initialize or retrieve the authenticated account
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: New or existing account state
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AccountState"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Database or consent lookup failed; no successful state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/consents/documents:
    get:
      tags:
        - Consents
      operationId: listActiveConsentDocuments
      summary: List backend-owned active legal document versions
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDocument"
        "500":
          description: Document registry unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/me/consents:
    get:
      tags:
        - Consents
      operationId: getOwnConsentStatus
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDecision"
        "401":
          description: Invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Consent lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    post:
      tags:
        - Consents
      operationId: recordConsentDecisions
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentSubmission"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConsentResult"
        "400":
          description: Invalid request or unsupported consent type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Consent persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/profile-data:
    get:
      tags:
        - Profile Data
      operationId: listProfileMasterData
      security:
        - supabaseJWT: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - gender
              - pronoun
              - show_me
              - looking_for
              - university
              - religion
              - personality
              - hobby_category
              - hobby
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          description: Only supported for hobby
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active records with stable pagination
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - type
                      - items
                      - pagination
                    properties:
                      type:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                          properties:
                            id:
                              type: string
                              format: uuid
                            code:
                              type: string
                            label:
                              type: string
                            name:
                              type: string
                            country_code:
                              type: string
                            category_id:
                              type: string
                              format: uuid
                      pagination:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - total_pages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
        "400":
          description: INVALID_MASTER_DATA_TYPE or INVALID_QUERY_PARAMETERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Master data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/photos/upload-urls:
