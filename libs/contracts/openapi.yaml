  /v1/photos/{id}:
    patch:
      tags:
        - Photos
      operationId: updatePhoto
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - photo_id
                      - position
                      - is_primary
                      - status
                    properties:
                      photo_id: *a1
                      position:
                        type: integer
                      is_primary:
                        type: boolean
                      status: &a16
                        type: string
                    additionalProperties: false
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
