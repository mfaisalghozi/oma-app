      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - updated
                      - updated_at
                    properties:
                      updated:
                        type: boolean
                      updated_at:
                        type: string
                        format: date-time
        "400": &a9
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401": &a10
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403": &a11
          description:
            Active completed account and current consent required for PUT;
            DELETE remains available without consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422": &a12
          description: INVALID_COORDINATES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500": &a13
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    delete:
      tags:
        - Locations
      operationId: deleteOwnLocation
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - deleted
                    properties:
                      deleted:
                        type: boolean
        "400": *a9
        "401": *a10
        "403": *a11
        "422": *a12
        "500": *a13
  /v1/me/consents/revocations:
    post:
      tags:
        - Consents
      operationId: revokeConsents
      summary:
        Append revocation decisions and restrict processing until required
        consent is re-accepted
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRevocation"
      responses:
        "200":
          description: Revocation recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: array
                        items:
                          type: object
                          required:
                            - type
                            - revoked_at
                          properties:
                            type:
                              type: string
                            revoked_at:
                              type: string
                              format: date-time
        "400":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/discovery:
    get:
      tags: [Discovery]
      operationId: getDiscoveryDeck
      summary: Read the current ordered Discovery deck
      security: [{supabaseJWT: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
        - {in: query, name: cursor, description: Opaque server-owned cursor bound to the authenticated viewer and current cache., schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Current eligible cards; first delivered candidate exposure is counted once per viewer and WIB date.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [context_id, cards, next_cursor, deck_expires_at, end_reason]
                    properties:
                      context_id: {type: string, format: uuid}
                      cards: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DiscoveryCard"}}
                      next_cursor: {type: string, format: uuid, nullable: true}
                      deck_expires_at: {type: string, format: date-time}
                      end_reason: {type: string, enum: [candidate_pool_exhausted], nullable: true}
        "400": {description: Invalid cursor or limit}
        "401": {description: Authentication required}
        "403": {description: Account, onboarding, consent or location gate failed}
        "409": {description: Stale cursor context}
        "503": {description: Discovery policy or storage unavailable}
  /v1/discovery/actions:
    post:
      tags: [Discovery]
      operationId: applyDiscoveryAction
      summary: Commit one irreversible decision for an eligible delivered candidate
      security: [{supabaseJWT: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 200}, description: Scoped to the authenticated actor. Reusing a key with a different canonical request conflicts.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_id, kind, context]
              properties:
                candidate_id: {type: string, format: uuid}
                kind: {type: string, enum: [pass, like, super_like]}
                context:
                  type: object
                  additionalProperties: false
                  required: [kind, id]
                  properties:
                    kind: {type: string, enum: [regular_deck]}
                    id: {type: string, format: uuid}
      responses:
        "200":
          description: Original committed decision with current match and conversation handoff state. Retained unmatched pairs return null match and remain excluded. Same-action retries under new keys alias the original decision without charging again. Pass is free; super_like debits its separate funded balance. Actions never increment exposure counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [action_id, action, match]
                    properties:
                      action_id: {type: string, format: uuid}
                      action: {type: string, enum: [pass, like, super_like]}
                      match:
                        type: object
                        nullable: true
                        required: [id, conversation_status, conversation_id]
                        properties:
                          id: {type: string, format: uuid}
                          conversation_status: {type: string, enum: [pending, ready]}
                          conversation_id: {type: string, format: uuid, nullable: true}
        "422": {description: Invalid action or idempotency key}
        "401": {description: Authentication required}
        "403": {description: Actor eligibility gate failed}
        "404": {description: Unavailable candidate or foreign context}
        "409": {description: Irreversible decision conflict, reused key conflict or stale context}
        "429": {description: LIKE_LIMIT_REACHED or SUPER_LIKE_BALANCE_EMPTY}
        "503": {description: Discovery policy or limits unavailable}
  /v1/me/usage:
    get:
      tags: [Discovery]
      operationId: getDailyUsage
      summary: Read fixed WIB daily grants and remaining usage for the authenticated actor
      security: [{supabaseJWT: []}]
      responses:
        "200":
          description: Likes have 15 base plus 15 at full profile completion. Describe searches have 3 free or 20 PRO. PRO comes only from the validated server development allowlist until billing exists.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [bucket, resets_at, pro, profile_complete, likes, searches]
                    properties:
                      bucket: {type: string, format: date}
                      resets_at: {type: string, format: date-time}
                      pro: {type: boolean}
                      profile_complete: {type: boolean}
                      likes: {$ref: "#/components/schemas/DailyBalance"}
                      searches: {$ref: "#/components/schemas/DailyBalance"}
        "400": {description: Query parameters are not accepted}
        "401": {description: Authentication required}
        "403": {description: Actor eligibility gate failed}
  /v1/discovery/candidates/{candidate_id}:
    get:
      tags: [Discovery]
      operationId: getDiscoveryCandidate
      summary: Read a currently eligible delivered card in an owned deck context
      security: [{supabaseJWT: []}]
      parameters:
        - {in: path, name: candidate_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: context_id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Safe current candidate projection with fresh signed active photos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/DiscoveryCard"}
        "401": {description: Authentication required}
        "403": {description: Eligibility gate failed}
        "404": {description: Unavailable candidate or foreign context}
        "409": {description: Stale context}
        "503": {description: Discovery policy or storage unavailable}
  /v1/me/discovery-preferences:
    patch:
      tags: [Discovery]
      operationId: updateDiscoveryPreferences
      summary: Update stored reciprocal age and distance preferences
      security: [{supabaseJWT: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                min_age: {type: integer, minimum: 18, maximum: 32767}
                max_age: {type: integer, minimum: 18, maximum: 32767}
                radius_km: {type: number, exclusiveMinimum: true, minimum: 0, description: Must not exceed the server-configured radius maximum.}
      responses:
        "200":
          description: Effective stored preferences; a changed value invalidates the cached deck.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [min_age, max_age, radius_km]
                    properties:
                      min_age: {type: integer}
                      max_age: {type: integer}
                      radius_km: {type: number}
        "401": {description: Authentication required}
        "403": {description: Account, onboarding or consent gate failed}
        "422": {description: Invalid preferences or minimum exceeds maximum}
        "503": {description: Discovery policy unavailable}
components:
  securitySchemes:
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    APIError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    AccountState:
      type: object
      required:
        - user_id
        - account_status
        - account_created
        - onboarding_completed
        - onboarding_completed_at
        - next_action
      properties:
        user_id:
          type: string
          format: uuid
        account_status:
          type: string
          enum:
            - active
            - frozen
            - suspended
        account_created:
          type: boolean
        onboarding_completed:
          type: boolean
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        suspended_until:
          type: string
          format: date-time
          nullable: true
        next_action:
          type: string
          enum:
            - accept_consents
            - complete_onboarding
            - discovery
            - account_restricted
    ConsentDocument:
      type: object
      required:
        - type
        - title
        - version
        - document_url
        - required
      properties:
        type: &a15
          type: string
          enum:
            - terms
            - privacy
            - sensitive_data
        title: &a14
          type: string
        version: *a14
        document_url: *a14
        required:
          type: boolean
      additionalProperties: false
    ConsentDecision:
      type: object
      required:
        - type
        - version
        - decision
        - recorded_at
      properties:
        type: *a15
        version: *a14
        decision:
          type: string
          enum:
            - accepted
            - rejected
            - revoked
        accepted_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      additionalProperties: false
    ConsentSubmission:
      type: object
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            required:
              - type
              - accepted
            properties:
              type: *a15
              accepted:
                type: boolean
            additionalProperties: false
          minItems: 1
          maxItems: 3
      additionalProperties: false
    ConsentResult:
      type: object
      required:
        - consents
        - required_consents_completed
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentDecision"
        required_consents_completed:
          type: boolean
      additionalProperties: false
    PhotoUpload:
      type: object
      required:
        - photo_id
        - bucket
        - path
        - upload_token
        - expires_at
      properties:
        photo_id: *a1
        bucket: *a16
        path: *a16
        upload_token: *a16
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Photo:
      type: object
      required:
        - id
        - storage_path
        - position
        - is_primary
        - status
        - signed_url
      properties:
        id: *a1
        storage_path: *a16
        position:
          type: integer
          nullable: true
        is_primary:
          type: boolean
        status:
          type: string
          enum:
            - pending_upload
            - active
        signed_url:
          type: string
          nullable: true
      additionalProperties: false
    PhotoReservation:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          items:
            type: object
            required:
              - content_type
              - file_size
            properties:
              filename: *a16
              content_type:
                type: string
                enum:
                  - image/jpeg
                  - image/png
                  - image/webp
              file_size:
                type: integer
                minimum: 1
                maximum: 10485760
            additionalProperties: false
          minItems: 1
          maxItems: 6
      additionalProperties: false
    PhotoPatch:
      type: object
      required: []
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 6
        is_primary:
          type: boolean
      additionalProperties: false
    ProfileInput:
      type: object
      required:
        - full_name
        - birthdate
        - gender_id
        - show_me_option_id
        - bio
        - height_cm
        - weight_kg
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        birthdate:
          type: string
          format: date
        gender_id: *a17
        pronoun_id: &a18
          type: string
          format: uuid
          nullable: true
        show_me_option_id: *a17
        bio: &a22
          type: string
          minLength: 1
          maxLength: 255
        height_cm: &a23
          type: integer
          minimum: 100
          maximum: 250
        weight_kg: &a24
          type: integer
          minimum: 25
          maximum: 300
        university_id: *a18
        ambition: &a25
          type: string
          maxLength: 500
          nullable: true
        religion_id: *a18
        personality_type_id: *a18
      additionalProperties: false
    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    OnboardingInput:
      type: object
      required:
        - profile
        - looking_for_ids
        - hobby_ids
        - photos
      properties:
        profile:
          $ref: "#/components/schemas/ProfileInput"
        looking_for_ids: &a26
          type: array
          items: *a17
          minItems: 1
          uniqueItems: true
        hobby_ids: &a27
          type: array
          items: *a17
          minItems: 1
          uniqueItems: true
        photos:
          type: array
          items:
            type: object
            required:
              - photo_id
              - position
            properties:
              photo_id: *a17
              position:
                type: integer
                minimum: 1
                maximum: 6
            additionalProperties: false
          minItems: 1
          maxItems: 6
        location:
          type: object
          nullable: true
          required:
            - latitude
            - longitude
          additionalProperties: false
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
      additionalProperties: false
    OwnProfile:
      type: object
      required:
        - user_id
        - full_name
        - birthdate
        - gender
        - show_me
        - bio
        - height_cm
        - weight_kg
        - looking_for
        - hobbies
        - photos
        - created_at
        - updated_at
      properties:
        user_id: &a19
          type: string
          format: uuid
        full_name: &a20
          type: string
        birthdate:
          type: string
          format: date
          description: Returned only to the authenticated profile owner
        gender: &a21
          type: object
          required:
            - id
            - code
            - label
          properties:
            id: *a19
            code: *a20
            label: *a20
          nullable: true
        pronoun: *a21
        show_me: *a21
        bio: *a20
        height_cm:
          type: integer
        weight_kg:
          type: integer
        university:
          type: object
          nullable: true
          properties:
            id: *a19
            name: *a20
            country_code: *a20
        ambition:
          type: string
          nullable: true
        religion: *a21
        personality: *a21
        looking_for:
          type: array
          items: *a21
        hobbies:
          type: array
          items:
            type: object
            properties:
              id: *a19
              code: *a20
              label: *a20
              category_id: *a19
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        bio: *a22
        height_cm: *a23
        weight_kg: *a24
        ambition: *a25
        university_id: *a18
        religion_id: *a18
        personality_type_id: *a18
        pronoun_id: *a18
        show_me_option_id: *a17
        looking_for_ids: *a26
        hobby_ids: *a27
    ConsentRevocation:
      type: object
      required:
        - consent_types
      additionalProperties: false
      properties:
        consent_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - terms
              - privacy
              - sensitive_data
        reason:
          type: string
          maxLength: 1000
          nullable: true

    DiscoveryCard:
      type: object
      additionalProperties: false
      required: [id, display_name, age, height_cm, approx_distance_km, bio, ambition, occupation, education_degree, profile_revision, photos, hobbies, looking_for, personality, religion, university]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, description: First name only}
        age: {type: integer, minimum: 18}
        height_cm: {type: integer}
        approx_distance_km: {type: integer, minimum: 0}
        bio: {type: string}
        ambition: {type: string, nullable: true}
        occupation: {type: string, nullable: true, description: Reserved public field; null until authored profile support exists.}
        education_degree: {type: string, nullable: true, description: Reserved public field; null until authored profile support exists.}
        profile_revision: {type: integer, format: int64}
        photos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, position, read_url]
            properties:
              id: {type: string, format: uuid}
              position: {type: integer}
              read_url: {type: string, format: uri}
        hobbies: {type: array, items: {$ref: "#/components/schemas/DiscoveryOption"}}
        looking_for: {type: array, items: {$ref: "#/components/schemas/DiscoveryOption"}}
        personality: {$ref: "#/components/schemas/DiscoveryNullableOption"}
        religion: {$ref: "#/components/schemas/DiscoveryNullableOption"}
        university:
          type: object
          nullable: true
          required: [id, name, country_code]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            country_code: {type: string}
    DiscoveryOption:
      type: object
      required: [id, code, label]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
    DiscoveryNullableOption:
      type: object
      nullable: true
      required: [id, code, label]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        label: {type: string}
    DailyBalance:
      type: object
      required: [limit, used, reserved, available]
      properties:
        limit: {type: integer, minimum: 0}
        used: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        available: {type: integer, minimum: 0}
