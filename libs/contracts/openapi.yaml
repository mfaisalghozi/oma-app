            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422": &a7
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500": &a8
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/devices/{id}:
    delete:
      tags:
        - Devices
      operationId: deleteOwnDevice
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - device_id
                      - deleted
                    properties:
                      device_id: *a2
                      deleted:
                        type: boolean
                    additionalProperties: false
        "400": *a3
        "401": *a4
        "403": *a5
        "404": *a6
        "422": *a7
        "500": *a8
  /v1/me/profile:
    get:
      tags:
        - Profiles
      operationId: getOwnProfile
      summary: Read the authenticated user’s profile, labels, and active photos
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Own profile; no coordinates or private attractiveness score
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OwnProfile"
        "401":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    patch:
      tags:
        - Profiles
      operationId: updateOwnProfile
      summary: Update only supplied editable profile fields
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - user_id
                      - updated
                      - updated_at
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      updated_at:
                        type: string
                        format: date-time
        "400":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Active completed account and current consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: INVALID_PROFILE_DATA with field details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/me/location:
    put:
      tags:
        - Locations
      operationId: updateOwnLocation
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Coordinates"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - updated
                      - updated_at
                    properties:
                      updated:
                        type: boolean
                      updated_at:
                        type: string
                        format: date-time
        "400": &a9
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401": &a10
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403": &a11
          description:
            Active completed account and current consent required for PUT;
            DELETE remains available without consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422": &a12
          description: INVALID_COORDINATES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500": &a13
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    delete:
      tags:
        - Locations
      operationId: deleteOwnLocation
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - deleted
                    properties:
                      deleted:
                        type: boolean
        "400": *a9
        "401": *a10
        "403": *a11
        "422": *a12
        "500": *a13
  /v1/me/consents/revocations:
    post:
      tags:
        - Consents
      operationId: revokeConsents
      summary:
        Append revocation decisions and restrict processing until required
        consent is re-accepted
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRevocation"
      responses:
        "200":
          description: Revocation recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: array
                        items:
                          type: object
                          required:
                            - type
                            - revoked_at
                          properties:
                            type:
                              type: string
                            revoked_at:
                              type: string
                              format: date-time
        "400":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Unsupported type, invalid request, restricted account, or
            persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
components:
  securitySchemes:
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    APIError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    AccountState:
      type: object
      required:
        - user_id
        - account_status
        - account_created
        - onboarding_completed
        - onboarding_completed_at
        - next_action
      properties:
        user_id:
          type: string
          format: uuid
        account_status:
          type: string
          enum:
            - active
            - frozen
            - suspended
        account_created:
          type: boolean
        onboarding_completed:
          type: boolean
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        suspended_until:
          type: string
          format: date-time
          nullable: true
        next_action:
          type: string
          enum:
            - accept_consents
            - complete_onboarding
            - discovery
            - account_restricted
    ConsentDocument:
      type: object
      required:
        - type
        - title
        - version
        - document_url
        - required
      properties:
        type: &a15
          type: string
          enum:
            - terms
            - privacy
            - sensitive_data
        title: &a14
          type: string
        version: *a14
        document_url: *a14
        required:
          type: boolean
      additionalProperties: false
    ConsentDecision:
      type: object
      required:
        - type
        - version
        - decision
        - recorded_at
      properties:
        type: *a15
        version: *a14
        decision:
          type: string
          enum:
            - accepted
            - rejected
            - revoked
        accepted_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      additionalProperties: false
    ConsentSubmission:
      type: object
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            required:
              - type
              - accepted
            properties:
              type: *a15
              accepted:
                type: boolean
            additionalProperties: false
          minItems: 1
          maxItems: 3
      additionalProperties: false
    ConsentResult:
      type: object
      required:
        - consents
        - required_consents_completed
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentDecision"
        required_consents_completed:
          type: boolean
      additionalProperties: false
    PhotoUpload:
      type: object
      required:
        - photo_id
        - bucket
        - path
        - upload_token
        - expires_at
      properties:
        photo_id: *a1
        bucket: *a16
        path: *a16
        upload_token: *a16
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Photo:
      type: object
      required:
        - id
        - storage_path
        - position
        - is_primary
        - status
        - signed_url
      properties:
        id: *a1
        storage_path: *a16
        position:
          type: integer
          nullable: true
        is_primary:
          type: boolean
        status:
          type: string
          enum:
            - pending_upload
            - active
        signed_url:
          type: string
          nullable: true
      additionalProperties: false
    PhotoReservation:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          items:
            type: object
            required:
              - content_type
              - file_size
            properties:
              filename: *a16
              content_type:
                type: string
                enum:
                  - image/jpeg
                  - image/png
                  - image/webp
              file_size:
                type: integer
                minimum: 1
                maximum: 10485760
            additionalProperties: false
          minItems: 1
          maxItems: 6
      additionalProperties: false
    PhotoPatch:
      type: object
      required: []
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 6
        is_primary:
          type: boolean
      additionalProperties: false
    ProfileInput:
      type: object
      required:
        - full_name
        - birthdate
        - gender_id
        - show_me_option_id
        - bio
        - height_cm
        - weight_kg
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        birthdate:
          type: string
          format: date
        gender_id: *a17
        pronoun_id: &a18
          type: string
          format: uuid
          nullable: true
        show_me_option_id: *a17
        bio: &a22
          type: string
          minLength: 1
          maxLength: 255
        height_cm: &a23
          type: integer
          minimum: 100
          maximum: 250
        weight_kg: &a24
          type: integer
          minimum: 25
          maximum: 300
        university_id: *a18
        ambition: &a25
          type: string
          maxLength: 500
          nullable: true
        religion_id: *a18
        personality_type_id: *a18
      additionalProperties: false
    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    OnboardingInput:
      type: object
      required:
        - profile
        - looking_for_ids
        - hobby_ids
        - photos
      properties:
        profile:
          $ref: "#/components/schemas/ProfileInput"
        looking_for_ids: &a26
          type: array
          items: *a17
          minItems: 1
          uniqueItems: true
        hobby_ids: &a27
          type: array
          items: *a17
          minItems: 1
          uniqueItems: true
        photos:
          type: array
          items:
            type: object
            required:
              - photo_id
              - position
            properties:
              photo_id: *a17
              position:
                type: integer
                minimum: 1
                maximum: 6
            additionalProperties: false
          minItems: 1
          maxItems: 6
        location:
          type: object
          nullable: true
          required:
            - latitude
            - longitude
          additionalProperties: false
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
      additionalProperties: false
    OwnProfile:
      type: object
      required:
        - user_id
        - full_name
        - birthdate
        - gender
        - show_me
        - bio
        - height_cm
        - weight_kg
        - looking_for
        - hobbies
        - photos
        - created_at
        - updated_at
      properties:
        user_id: &a19
          type: string
          format: uuid
        full_name: &a20
          type: string
        birthdate:
          type: string
          format: date
          description: Returned only to the authenticated profile owner
        gender: &a21
          type: object
          required:
            - id
            - code
            - label
          properties:
            id: *a19
            code: *a20
            label: *a20
          nullable: true
        pronoun: *a21
        show_me: *a21
        bio: *a20
        height_cm:
          type: integer
        weight_kg:
          type: integer
        university:
          type: object
          nullable: true
          properties:
            id: *a19
            name: *a20
            country_code: *a20
        ambition:
          type: string
          nullable: true
        religion: *a21
        personality: *a21
        looking_for:
          type: array
          items: *a21
        hobbies:
          type: array
          items:
            type: object
            properties:
              id: *a19
              code: *a20
              label: *a20
              category_id: *a19
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        bio: *a22
        height_cm: *a23
        weight_kg: *a24
        ambition: *a25
        university_id: *a18
        religion_id: *a18
        personality_type_id: *a18
        pronoun_id: *a18
        show_me_option_id: *a17
        looking_for_ids: *a26
        hobby_ids: *a27
    ConsentRevocation:
      type: object
      required:
        - consent_types
      additionalProperties: false
      properties:
        consent_types:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - terms
              - privacy
              - sensitive_data
        reason:
          type: string
          maxLength: 1000
          nullable: true
