openapi: 3.0.3
info:
  title: Oma API
  version: 0.1.0
  description: Shared API contract for the Go backend and its clients.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /v1/me/initialize:
    post:
      operationId: initializeAccount
      summary: Initialize or retrieve the authenticated account
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: New or existing account state
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/AccountState"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Database or consent lookup failed; no successful state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/consents/documents:
    get:
      operationId: listActiveConsentDocuments
      summary: List backend-owned active legal document versions
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDocument"
        "500":
          description: Document registry unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/me/consents:
    get:
      operationId: getOwnConsentStatus
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDecision"
        "401":
          description: Invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Consent lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    post:
      operationId: recordConsentDecisions
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentSubmission"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ConsentResult"
        "400":
          description: Invalid request or unsupported consent type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Consent persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/profile-data:
    get:
      operationId: listProfileMasterData
      security:
        - supabaseJWT: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - gender
              - pronoun
              - show_me
              - looking_for
              - university
              - religion
              - personality
              - hobby_category
              - hobby
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          description: Only supported for hobby
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active records with stable pagination
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - type
                      - items
                      - pagination
                    properties:
                      type:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                          properties:
                            id:
                              type: string
                              format: uuid
                            code:
                              type: string
                            label:
                              type: string
                            name:
                              type: string
                            country_code:
                              type: string
                            category_id:
                              type: string
                              format: uuid
                      pagination:
                        type: object
                        required:
                          - page
                          - limit
                          - total
                          - total_pages
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
        "400":
          description: INVALID_MASTER_DATA_TYPE or INVALID_QUERY_PARAMETERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Account missing or restricted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Master data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/photos/upload-urls:
    post:
      operationId: reservePhotoUploads
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoReservation"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoUpload"
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/photos/{id}/upload-url:
    post:
      operationId: refreshPhotoUpload
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PhotoUpload"
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/photos:
    get:
      operationId: listOwnPhotos
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Photo"
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/photos/{id}:
    patch:
      operationId: updatePhoto
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoPatch"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - photo_id
                      - position
                      - is_primary
                      - status
                    properties:
                      photo_id: *a1
                      position:
                        type: integer
                      is_primary:
                        type: boolean
                      status: &a11
                        type: string
                    additionalProperties: false
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    delete:
      operationId: deletePhoto
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - photo_id
                      - deleted
                    properties:
                      photo_id: *a1
                      deleted:
                        type: boolean
                    additionalProperties: false
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/me/onboarding:
    post:
      operationId: submitOnboarding
      summary: Atomically persist the complete onboarding form
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - user_id
                      - onboarding_completed
                      - onboarding_completed_at
                    properties:
                      user_id: &a12
                        type: string
                        format: uuid
                      onboarding_completed:
                        type: boolean
                        enum:
                          - true
                      onboarding_completed_at:
                        type: string
                        format: date-time
                    additionalProperties: false
        "400":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: CONSENT_REQUIRED or restricted/uninitialized account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: ONBOARDING_ALREADY_COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: ONBOARDING_VALIDATION_FAILED with all invalid fields, or
            PHOTO_UPLOAD_INCOMPLETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: STORAGE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/devices:
    post:
      operationId: registerDevice
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - platform
                - provider
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 8192
                platform:
                  type: string
                  enum:
                    - ios
                    - android
                provider:
                  type: string
                  enum:
                    - fcm
                    - apns
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - device_id
                      - registered
                    properties:
                      device_id: &a2
                        type: string
                        format: uuid
                      registered:
                        type: boolean
                    additionalProperties: false
        "400": &a3
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401": &a4
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403": &a5
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404": &a6
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422": &a7
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500": &a8
          description: Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/devices/{id}:
    delete:
      operationId: deleteOwnDevice
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - device_id
                      - deleted
                    properties:
                      device_id: *a2
                      deleted:
                        type: boolean
                    additionalProperties: false
        "400": *a3
        "401": *a4
        "403": *a5
        "404": *a6
        "422": *a7
        "500": *a8
components:
  securitySchemes:
    supabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    APIError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
    AccountState:
      type: object
      required:
        - user_id
        - account_status
        - account_created
        - onboarding_completed
        - onboarding_completed_at
        - next_action
      properties:
        user_id:
          type: string
          format: uuid
        account_status:
          type: string
          enum:
            - active
            - frozen
            - suspended
        account_created:
          type: boolean
        onboarding_completed:
          type: boolean
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        suspended_until:
          type: string
          format: date-time
          nullable: true
        next_action:
          type: string
          enum:
            - accept_consents
            - complete_onboarding
            - discovery
            - account_restricted
    ConsentDocument:
      type: object
      required:
        - type
        - title
        - version
        - document_url
        - required
      properties:
        type: &a10
          type: string
          enum:
            - terms
            - privacy
            - sensitive_data
        title: &a9
          type: string
        version: *a9
        document_url: *a9
        required:
          type: boolean
      additionalProperties: false
    ConsentDecision:
      type: object
      required:
        - type
        - version
        - decision
        - accepted_at
      properties:
        type: *a10
        version: *a9
        decision:
          type: string
          enum:
            - accepted
            - rejected
            - revoked
        accepted_at:
          type: string
          format: date-time
      additionalProperties: false
    ConsentSubmission:
      type: object
      required:
        - consents
      properties:
        consents:
          type: array
          items:
            type: object
            required:
              - type
              - accepted
            properties:
              type: *a10
              accepted:
                type: boolean
            additionalProperties: false
          minItems: 1
          maxItems: 3
      additionalProperties: false
    ConsentResult:
      type: object
      required:
        - consents
        - required_consents_completed
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentDecision"
        required_consents_completed:
          type: boolean
      additionalProperties: false
    PhotoUpload:
      type: object
      required:
        - photo_id
        - bucket
        - path
        - upload_token
        - expires_at
      properties:
        photo_id: *a1
        bucket: *a11
        path: *a11
        upload_token: *a11
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Photo:
      type: object
      required:
        - id
        - storage_path
        - position
        - is_primary
        - status
        - signed_url
      properties:
        id: *a1
        storage_path: *a11
        position:
          type: integer
          nullable: true
        is_primary:
          type: boolean
        status:
          type: string
          enum:
            - pending_upload
            - active
        signed_url:
          type: string
          nullable: true
      additionalProperties: false
    PhotoReservation:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          items:
            type: object
            required:
              - content_type
              - file_size
            properties:
              filename: *a11
              content_type:
                type: string
                enum:
                  - image/jpeg
                  - image/png
                  - image/webp
              file_size:
                type: integer
                minimum: 1
                maximum: 10485760
            additionalProperties: false
          minItems: 1
          maxItems: 6
      additionalProperties: false
    PhotoPatch:
      type: object
      required: []
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 6
        is_primary:
          type: boolean
      additionalProperties: false
    ProfileInput:
      type: object
      required:
        - full_name
        - birthdate
        - gender_id
        - show_me_option_id
        - bio
        - height_cm
        - weight_kg
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        birthdate:
          type: string
          format: date
        gender_id: *a12
        pronoun_id: &a13
          type: string
          format: uuid
          nullable: true
        show_me_option_id: *a12
        bio:
          type: string
          minLength: 1
          maxLength: 255
        height_cm:
          type: integer
          minimum: 100
          maximum: 250
        weight_kg:
          type: integer
          minimum: 25
          maximum: 300
        university_id: *a13
        ambition:
          type: string
          maxLength: 500
          nullable: true
        religion_id: *a13
        personality_type_id: *a13
      additionalProperties: false
    Coordinates:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
    OnboardingInput:
      type: object
      required:
        - profile
        - looking_for_ids
        - hobby_ids
        - photos
      properties:
        profile:
          $ref: "#/components/schemas/ProfileInput"
        looking_for_ids:
          type: array
          items: *a12
          minItems: 1
          uniqueItems: true
        hobby_ids:
          type: array
          items: *a12
