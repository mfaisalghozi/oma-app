            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500": &a8
          description:
            Invalid input, missing device, restricted account, or persistence
            failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/devices/{id}:
