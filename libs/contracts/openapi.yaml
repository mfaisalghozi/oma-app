        - Devices
      operationId: deleteOwnDevice
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - device_id
                      - deleted
                    properties:
                      device_id: *a2
                      deleted:
                        type: boolean
                    additionalProperties: false
        "400": *a3
        "401": *a4
        "403": *a5
        "404": *a6
        "422": *a7
        "500": *a8
  /v1/me/profile:
    get:
      tags:
        - Profiles
      operationId: getOwnProfile
      summary: Read the authenticated user’s profile, labels, and active photos
      security:
        - supabaseJWT: []
      responses:
        "200":
          description: Own profile; no coordinates or private attractiveness score
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OwnProfile"
        "401":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "404":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: Authentication, account, profile lookup or storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    patch:
      tags:
        - Profiles
      operationId: updateOwnProfile
      summary: Update only supplied editable profile fields
      security:
        - supabaseJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - user_id
                      - updated
                      - updated_at
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      updated:
                        type: boolean
                      updated_at:
                        type: string
                        format: date-time
        "400":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Active completed account and current consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: INVALID_PROFILE_DATA with field details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Request invalid or persistence failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/me/location:
