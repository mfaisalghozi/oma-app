      operationId: deletePhoto
      security:
        - supabaseJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - photo_id
                      - deleted
                    properties:
                      photo_id: *a1
                      deleted:
                        type: boolean
                    additionalProperties: false
        "400":
          description: Request rejected or dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Request rejected or dependency unavailable
          content:
