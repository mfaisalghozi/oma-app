<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Confirm your OMA email</title></head>
  <body style="margin:0;padding:24px;background:#f6f7f9;color:#20242c;font-family:Arial,sans-serif;line-height:1.6">
    <main style="max-width:520px;margin:0 auto;padding:28px;background:#ffffff;border-radius:12px">
      <h1 style="margin-top:0;font-size:24px">Confirm your email</h1>
      <p>Welcome to OMA. Confirm your email address to continue creating your account.</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;background:#243c77;color:#ffffff;text-decoration:none;border-radius:8px">Confirm email address</a></p>
      <p>If the button does not work, open this link:</p>
      <p style="overflow-wrap:anywhere"><a href="{{ .ConfirmationURL }}">{{ .ConfirmationURL }}</a></p>
      <p>If you did not create an OMA account, you can ignore this email.</p>
    </main>
  </body>
</html>
