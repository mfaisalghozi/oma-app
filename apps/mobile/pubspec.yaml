name: oma_app
description: "OMA (Ocean Match) mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Versions are pinned exactly (architecture doc: "Pin exact versions at project
# start"). Bump them on purpose, one PR at a time.
dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: 3.4.3
  go_router: 18.1.2

  # Network and auth
  dio: 5.11.1
  supabase_flutter: 2.18.3
  google_sign_in: 7.2.0
  sign_in_with_apple: 8.2.0

  # Local storage
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6

  # Media (M09) and on-device NSFW check (decided 2026-11-03)
  image_picker: 1.2.4
  flutter_image_compress: 2.5.1
  nsfw_detect: 2.8.0
  crypto: 3.0.7
  path_provider: 2.1.6

  # Location and permissions (M10, M11)
  geolocator: 14.1.2
  permission_handler: 13.0.2

  # Push (M11)
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

  # Utility
  url_launcher: 6.3.3
  uuid: 4.6.0
  meta: 1.19.0
  cupertino_icons: 1.0.8
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Nunito is bundled (not fetched at runtime) so the first frame never shows a
  # fallback font. SIL Open Font License, see assets/fonts/OFL.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
